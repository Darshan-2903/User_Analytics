
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CausalFunnel Demo Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #202938;
    }

    header {
      background: #172554;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      max-width: 850px;
      margin: 35px auto;
      padding: 24px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 12px #00000010;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <h1>Demo Store</h1>
    <p>Explore products and test analytics tracking</p>
  </header>

  <main>
    <h2>Featured Products</h2>

    <div class="products">
      <article class="product">
        <h3>Wireless Headphones</h3>
        <p>₹1,999</p>
        <button>Add to Cart</button>
      </article>

      <article class="product">
        <h3>Smart Watch</h3>
        <p>₹2,499</p>
        <button>Add to Cart</button>
      </article>

      <article class="product">
        <h3>Bluetooth Speaker</h3>
        <p>₹999</p>
        <button>View Details</button>
      </article>
    </div>
  </main>

  <script src="/tracker.js"></script>
</body>
</html>
